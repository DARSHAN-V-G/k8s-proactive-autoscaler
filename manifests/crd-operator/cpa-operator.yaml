# Custom Pod Autoscaler Operator - Complete Self-Contained Deployment Manifests
# Includes CRD, RBAC, ServiceAccount, and Operator Deployment
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: custompodautoscalers.custompodautoscaler.com
spec:
  group: custompodautoscaler.com
  names:
    kind: CustomPodAutoscaler
    listKind: CustomPodAutoscalerList
    plural: custompodautoscalers
    singular: custompodautoscaler
    shortNames:
      - cpa
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: custom-pod-autoscaler-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: custom-pod-autoscaler-operator
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: custom-pod-autoscaler-operator
subjects:
  - kind: ServiceAccount
    name: custom-pod-autoscaler-operator
    namespace: default
roleRef:
  kind: ClusterRole
  name: custom-pod-autoscaler-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-pod-autoscaler-operator
  labels:
    app: custom-pod-autoscaler-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-pod-autoscaler-operator
  template:
    metadata:
      labels:
        app: custom-pod-autoscaler-operator
    spec:
      serviceAccountName: custom-pod-autoscaler-operator
      containers:
        - name: manager
          image: custompodautoscaler/operator:v1.2.1
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
