# Kind Cluster Configuration for Kubernetes Autoscaler Benchmark
# Creates 1 Control Plane Node and 2 Worker Nodes (Matching Paper Section 5)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-autoscaler
nodes:
  - role: control-plane
    image: kindest/node:v1.27.3
  - role: worker
    image: kindest/node:v1.27.3
  - role: worker
    image: kindest/node:v1.27.3
